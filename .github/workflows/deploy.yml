name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Codzienny rebuild — publikuje posty z zaplanowaną datą (src/utils/posts.ts).
  # 03:30 UTC = 05:30 latem / 04:30 zimą w Polsce. Działa tylko z gałęzi domyślnej (main).
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro
        run: npm run build
        env:
          # Variables — wartości niechronione, widoczne w logach
          PUBLIC_FORMSPARK_FORM_ID:         ${{ vars.PUBLIC_FORMSPARK_FORM_ID }}
          PUBLIC_FORMSPARK_EVENTS_FORM_ID:  ${{ vars.PUBLIC_FORMSPARK_EVENTS_FORM_ID }}
          PUBLIC_TURNSTILE_SITE_KEY:        ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
